name: Repository quality

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  repository-validation:
    name: Repository Validation
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository invariants
        shell: pwsh
        run: ./scripts/validate-repository.ps1

  unity-tests:
    name: Unity Tests
    runs-on: ubuntu-latest
    # Fork PRs never receive repository secrets on the `pull_request` trigger; skip the job
    # outright for them instead of letting it fail on empty credentials. Do not switch this
    # workflow to pull_request_target to "fix" that — it would expose secrets to untrusted code.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      checks: write
    env:
      UNITY_CI_ENABLED: ${{ vars.UNITY_CI_ENABLED }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check Unity CI capability
        id: capability
        shell: bash
        run: |
          if [ "$UNITY_CI_ENABLED" != "true" ]; then
            echo "::notice::Unity CI is disabled (repository variable UNITY_CI_ENABLED is not 'true'). Unity EditMode/PlayMode tests were NOT executed."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::UNITY_CI_ENABLED is true but UNITY_EMAIL and/or UNITY_PASSWORD repository secrets are missing."
            exit 1
          fi
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::UNITY_CI_ENABLED is true but neither UNITY_LICENSE (Personal license) nor UNITY_SERIAL (Professional/Plus license) is configured."
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.capability.outputs.run == 'true'
        with:
          lfs: true

      - uses: actions/cache@v4
        if: steps.capability.outputs.run == 'true'
        with:
          path: Library
          key: Library-unity-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-unity-
            Library-

      - name: Run Unity EditMode tests
        if: ${{ steps.capability.outputs.run == 'true' && !cancelled() }}
        id: editmode
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: editmode
          artifactsPath: editmode-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode test results

      - name: Run Unity PlayMode tests
        if: ${{ steps.capability.outputs.run == 'true' && !cancelled() }}
        id: playmode
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: playmode
          artifactsPath: playmode-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity PlayMode test results

      - name: Upload EditMode test artifacts
        if: ${{ steps.capability.outputs.run == 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: ${{ steps.editmode.outputs.artifactsPath }}

      - name: Upload PlayMode test artifacts
        if: ${{ steps.capability.outputs.run == 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-playmode-results
          path: ${{ steps.playmode.outputs.artifactsPath }}

      - name: Require both Unity suites to pass
        if: steps.capability.outputs.run == 'true'
        shell: bash
        run: |
          if [ "${{ steps.editmode.outcome }}" != "success" ] || [ "${{ steps.playmode.outcome }}" != "success" ]; then
            echo "::error::Unity EditMode and/or PlayMode tests failed (editmode=${{ steps.editmode.outcome }}, playmode=${{ steps.playmode.outcome }})."
            exit 1
          fi
